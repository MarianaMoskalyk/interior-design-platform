services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomplan
      POSTGRES_PASSWORD: roomplan_dev_password
      POSTGRES_DB: roomplan_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
